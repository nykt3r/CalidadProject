spring:
  application:
    name: reservas-api
  datasource:
    url: jdbc:h2:mem:reservas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false

server:
  port: 8080