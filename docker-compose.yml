version: "3.8"

# Servidor SonarQube (Community) + su base de datos PostgreSQL.
# Version fija 26.8.0 (tag inmutable) para reproducibilidad; evita el tag flotante lts-community.
# Corre como "sidecar": NO toca el devcontainer de desarrollo.
#
# Uso:
#   docker compose up -d          # levanta SonarQube en http://localhost:9000
#   docker compose down           # detiene (sin borrar datos)
#   docker compose down -v        # detiene y borra los datos/volúmenes
#
# Primer acceso: usuario admin / password admin (te pedirá cambiarla).

services:
  sonarqube:
    image: sonarqube:26.8.0.126808-community
    container_name: sonarqube
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_pgdata:
